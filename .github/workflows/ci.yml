name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  NODE_ENV: production
  NEXT_PUBLIC_API_URL: https://ci.example.com/api
  NEXT_PUBLIC_APP_URL: https://ci.example.com
  NEXT_PUBLIC_OPENPANEL_CLIENT_ID: ci-openpanel-client-id
  NEXT_PUBLIC_GIPHY_API_KEY: ci-giphy-api-key
  OPENPANEL_API_URL: https://ci.example.com/openpanel
  OPENPANEL_CLIENT_SECRET: ci-openpanel-client-secret
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
  CLERK_SECRET_KEY: sk_test_ci_placeholder
  SENTRY_ENABLED: "false"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  check-types:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm check-types

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/worker/go.mod
          cache-dependency-path: apps/worker/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build monorepo (Turbo)
        run: pnpm build

      - name: Build Go worker
        run: pnpm build:worker-go

  ci-summary:
    name: CI summary
    runs-on: ubuntu-latest
    needs: [lint, check-types, build]
    if: always()
    steps:
      - name: Write job summary
        run: |
          {
            echo "## CI report"
            echo ""
            echo "| Check | Status |"
            echo "| --- | --- |"
            echo "| lint | ${{ needs.lint.result }} |"
            echo "| check-types | ${{ needs.check-types.result }} |"
            echo "| build | ${{ needs.build.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
