root = "."
tmp_dir = "tmp"

[build]
bin = "./tmp/main"
cmd = "go build -o ./tmp/main ./src/cmd/api"
delay = 500
exclude_dir = ["tmp", "bin", "vendor", "node_modules", "migrations"]
exclude_regex = ["_test\\.go$"]
include_ext = ["go"]
kill_delay = "2s"
send_interrupt = true
stop_on_error = true
[build.windows]
bin = "./tmp/main.exe"
cmd = "go build -o ./tmp/main.exe ./src/cmd/api"

[log]
time = false

[misc]
clean_on_exit = true
