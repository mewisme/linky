schema:
  - schema/*.graphqls

exec:
  filename: generated/generated.go
  package: generated

model:
  filename: generated/models_gen.go
  package: generated

resolver:
  layout: follow-schema
  dir: resolver
  package: resolver
  filename_template: "{name}.resolvers.go"

models:
  JSON:
    model:
      - github.com/99designs/gqlgen/graphql.Any
  Viewer:
    fields:
      me:
        resolver: true
      details:
        resolver: true
      settings:
        resolver: true
      profile:
        resolver: true
      level:
        resolver: true
      streak:
        resolver: true
      progress:
        resolver: true
      notifications:
        resolver: true
      unreadNotificationCount:
        resolver: true
      callHistory:
        resolver: true
      callHistoryItem:
        resolver: true
      reports:
        resolver: true
      streakCalendar:
        resolver: true
      streakHistory:
        resolver: true
      favorites:
        resolver: true
      blocks:
        resolver: true
  Admin:
    fields:
      reports:
        resolver: true
      report:
        resolver: true
      interestTags:
        resolver: true
      expBonuses:
        resolver: true
      config:
        resolver: true
      configByKey:
        resolver: true
      broadcasts:
        resolver: true
      embeddings:
        resolver: true
      users:
        resolver: true
      user:
        resolver: true
      aiConfig:
        resolver: true
      aiModels:
        resolver: true
  ViewerMutation:
    fields:
      updateCountry:
        resolver: true
      updateUserDetails:
        resolver: true
      addInterestTags:
        resolver: true
      removeInterestTags:
        resolver: true
      replaceInterestTags:
        resolver: true
      clearInterestTags:
        resolver: true
      addFavorite:
        resolver: true
      removeFavorite:
        resolver: true
      createBlock:
        resolver: true
      deleteBlock:
        resolver: true
      createReport:
        resolver: true
      createCallHistory:
        resolver: true
  AdminMutation:
    fields:
      patchUser:
        resolver: true
      softDeleteUser:
        resolver: true
      patchReport:
        resolver: true
      enqueueReportAiSummary:
        resolver: true
      regenerateEmbeddings:
        resolver: true
      syncEmbeddings:
        resolver: true
      syncAllEmbeddings:
        resolver: true
      compareEmbeddings:
        resolver: true
      findSimilarEmbeddings:
        resolver: true
      createBroadcast:
        resolver: true
      generateBroadcastAi:
        resolver: true
      updateAiConfig:
        resolver: true
  Mutation:
    fields:
      viewer:
        resolver: true
      admin:
        resolver: true
