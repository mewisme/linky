services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: mewthedev/linky:latest
    command: api
    container_name: linky-api
    ports:
      - "${PORT:-7270}:${PORT:-7270}"
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      OLLAMA_EMBEDDING_URL: http://ollama:11434
      OLLAMA_EMBEDDING_MODEL: bge-m3
      OLLAMA_CLOUD_MODEL: ministral-3:14b
      OLLAMA_EMBEDDING_TIMEOUT: 60000
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${PORT:-7270}/healthz"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - linky-network
    env_file:
      - .env

  # worker:
  #   build:
