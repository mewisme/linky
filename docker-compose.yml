  #     - .env

  worker-go:
    build:
      context: ./apps/worker-go
      dockerfile: Dockerfile
    image: mewthedev/linky-worker:latest
    container_name: linky-worker
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      INTERNAL_API_BASE_URL: http://api:${PORT:-7270}
      INTERNAL_API_TIMEOUT_MS: 120000
      INTERNAL_API_MAX_RETRIES: 3
      INTERNAL_API_RETRY_BASE_DELAY_MS: 500
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - linky-network
    env_file:
      - .env

  redis:
    image: redis:8-alpine
    container_name: linky-redis
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - linky-network

  ollama:
    image: mewthedev/oe:latest
    container_name: linky-ollama
    restart: unless-stopped
    environment:
      OLLAMA_VULKAN: 1
      OLLAMA_KEEP_ALIVE: 1m
    healthcheck:
      test: "ollama ps || exit 1"
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    networks:
      - linky-network
    volumes:
      - ollama-data:/root/.ollama
    env_file:
      - .env

volumes:
  redis-data:
  ollama-data:

networks:
  linky-network:
    driver: bridge
