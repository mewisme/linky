services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: mewthedev/linky:latest
    container_name: linky-api
    ports:
      - "${PORT:-7270}:${PORT:-7270}"
    environment:
      NODE_ENV: production
      JOB_WORKER_CONCURRENCY: 4
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${PORT:-7270}/healthz"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - linky-network
    env_file:
      - .env

  redis:
    image: redis:8-alpine
    container_name: linky-redis
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - linky-network

volumes:
  redis-data:

networks:
  linky-network:
    driver: bridge
