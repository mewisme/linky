packages:
  - apps/*
  - packages/*

allowBuilds:
  '@clerk/shared': true
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': true
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true

catalog:
  '@types/node': ^25.9.1
  dotenv: ^17.4.2
  eslint: ^9.39.4
  react: ^19.2.5
  redis: ^5.12.1
  socket.io: ^4.8.3
  socket.io-client: ^4.8.3
  tsup: ^8.5.1
  tsx: ^4.22.3
  typescript: ^5.9.3
  vitest: ^4.1.6
  zod: 4.4.3

injectWorkspacePackages: true

onlyBuiltDependencies:
  - '@clerk/shared'
  - '@parcel/watcher'
  - '@sentry/cli'
  - '@swc/core'
  - esbuild
  - msw
  - protobufjs
  - sharp
  - supabase
  - unrs-resolver
