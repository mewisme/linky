[project]
name = "linky-e2e"
version = "0.1.0"
description = "Linky E2E tests (Selenium + CloakBrowser), standalone from the monorepo"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromedriver-autoinstaller>=0.6.4",
    "cloakbrowser>=0.3.30",
    "openpyxl>=3.1.5",
    "pytest>=9.0.3",
    "pytest-html>=4.2.0",
    "pytest-xdist>=3.8.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "selenium>=4.44.0",
    "tenacity>=9.1.4",
]

[project.scripts]
ensure-cloak = "linky_e2e.browser.ensure_cloak:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["linky_e2e"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "auth: authentication suite",
    "user_profile: user profile suite",
    "video_chat: video chat suite (run serially)",
    "network_mock: tests that mock network via CDP",
    "slow: flaky or long-running tests",
]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
